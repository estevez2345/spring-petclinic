name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/add-ci-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/estevez2345/spring-petclinic

jobs:
  ci:
    name: Build, Test and Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Give permission to Maven wrapper
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw verify

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=utn \
            -Dsonar.projectKey=estevez2345_spring-petclinic \
            -Dsonar.token=$SONAR_TOKEN

  docker:
    name: Docker Build, Trivy Scan and Push
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${IMAGE_NAME}:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t $IMAGE_TAG .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/estevez2345/spring-petclinic:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        run: docker push $IMAGE_TAG

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'

    env:
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${IMAGE_NAME}:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Configure kubeconfig
        if: env.KUBE_CONFIG_B64 != ''
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > $HOME/.kube/config

      - name: Update Kubernetes deployment image
        if: env.KUBE_CONFIG_B64 != ''
        run: |
          kubectl set image deployment/petclinic petclinic=$IMAGE_TAG -n devops-lab

      - name: Verify rollout
        if: env.KUBE_CONFIG_B64 != ''
        run: |
          kubectl rollout status deployment/petclinic -n devops-lab

      - name: Skip deploy when KUBE_CONFIG is not configured
        if: env.KUBE_CONFIG_B64 == ''
        run: |
          echo "KUBE_CONFIG secret is not configured."
          echo "Deploy to minikube was executed locally for the workshop."
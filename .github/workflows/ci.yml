name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/add-ci-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Give permission to Maven wrapper
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw verify

name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/add-ci-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test and Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Give permission to Maven wrapper
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw verify

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.token=$SONAR_TOKEN
